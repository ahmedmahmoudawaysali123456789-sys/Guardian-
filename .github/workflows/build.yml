name: Build Battery Guard
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          mkdir -p battery_guard overlay_app/app/src/main/java/com/guard/overlay
          cat > battery_guard/module.prop <<'GUARD_EOF'
          id=battery_guard
          name=Battery Guard
          version=1.0
          versionCode=1
          author=you
          description=Lock screen overlay at 1% battery until charging (calls still work)
          GUARD_EOF
          cat > battery_guard/customize.sh <<'GUARD_EOF'
          SKIPUNZIP=0
          if [ -f "$MODPATH/overlay.apk" ]; then
            cp "$MODPATH/overlay.apk" /data/local/tmp/overlay.apk
            pm install -r /data/local/tmp/overlay.apk
            rm -f /data/local/tmp/overlay.apk
            ui_print "- overlay app installed"
          else
            ui_print "! overlay.apk not found, put it in module root and reflash"
          fi
          GUARD_EOF
          cat > battery_guard/service.sh <<'GUARD_EOF'
          #!/system/bin/sh
          until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done
          PKG=com.guard.overlay
          B=/sys/class/power_supply/battery
          appops set $PKG SYSTEM_ALERT_WINDOW allow
          STATE=0; N=0

          call_state() { dumpsys telephony.registry | grep -m1 mCallState | tr -dc '0-9' | cut -c1; }
          send() { am broadcast -f 0x20 -a "$1" -p $PKG >/dev/null 2>&1; }

          while true; do
            CAP=$(cat $B/capacity); ST=$(cat $B/status); CALL=$(call_state)
            if [ "$CAP" -le 1 ] && [ "$ST" != "Charging" ] && [ "$ST" != "Full" ] && { [ -z "$CALL" ] || [ "$CALL" = "0" ]; }; then
              N=$((N+1))
              if [ $STATE = 0 ] || [ $N -ge 5 ]; then send com.guard.SHOW; STATE=1; N=0; fi
            else
              if [ $STATE = 1 ]; then send com.guard.HIDE; STATE=0; N=0; fi
            fi
            sleep 1
          done
          GUARD_EOF
          cat > overlay_app/settings.gradle.kts <<'GUARD_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "overlay_app"
          include(":app")
          GUARD_EOF
          cat > overlay_app/build.gradle.kts <<'GUARD_EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          GUARD_EOF
          cat > overlay_app/app/build.gradle.kts <<'GUARD_EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "com.guard.overlay"
            compileSdk = 34
            defaultConfig { applicationId = "com.guard.overlay"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
            kotlinOptions { jvmTarget = "17" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          GUARD_EOF
          cat > overlay_app/app/src/main/AndroidManifest.xml <<'GUARD_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <application android:label="Battery Guard">
              <receiver android:name=".GuardReceiver" android:exported="true">
                <intent-filter>
                  <action android:name="com.guard.SHOW"/>
                  <action android:name="com.guard.HIDE"/>
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          GUARD_EOF
          cat > overlay_app/app/src/main/java/com/guard/overlay/GuardReceiver.kt <<'GUARD_EOF'
          package com.guard.overlay

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          class BatteryIcon(ctx: Context, private val tint: Int) : View(ctx) {
            private val p = Paint(Paint.ANTI_ALIAS_FLAG)
            override fun onDraw(c: Canvas) {
              val w = width.toFloat()
              val h = height.toFloat()
              val bodyW = w * 0.88f
              val s = h * 0.09f
              p.color = tint
              p.style = Paint.Style.STROKE
              p.strokeWidth = s
              c.drawRoundRect(RectF(s / 2, s / 2, bodyW - s / 2, h - s / 2), h * 0.22f, h * 0.22f, p)
              p.style = Paint.Style.FILL
              c.drawRoundRect(RectF(bodyW + s * 0.5f, h * 0.34f, w, h * 0.66f), s, s, p)
              val pad = s * 1.9f
              c.drawRoundRect(RectF(pad, pad, pad + (bodyW - pad * 2) * 0.12f, h - pad), h * 0.08f, h * 0.08f, p)
            }
          }

          class GuardReceiver : BroadcastReceiver() {

            private fun dp(ctx: Context, v: Int): Int =
              TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), ctx.resources.displayMetrics).toInt()

            private fun label(ctx: Context, txt: String, sp: Float, color: Int, bold: Boolean): TextView =
              TextView(ctx).apply {
                text = txt
                textSize = sp
                setTextColor(color)
                gravity = Gravity.CENTER
                textAlignment = View.TEXT_ALIGNMENT_CENTER
                if (bold) setTypeface(typeface, android.graphics.Typeface.BOLD)
              }

            private fun buildView(ctx: Context, blur: Boolean): View {
              val night = (ctx.resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
              val cardColor = Color.parseColor(if (night) "#2B2B30" else "#FFFFFF")
              val titleColor = Color.parseColor(if (night) "#F2F2F2" else "#1C1B1F")
              val subColor = Color.parseColor(if (night) "#B0B3B8" else "#5F6368")
              val noteColor = Color.parseColor(if (night) "#8E9196" else "#80868B")
              val lineColor = Color.parseColor(if (night) "#3C3C42" else "#E6E6E6")
              val accent = Color.parseColor("#E5484D")

              val root = FrameLayout(ctx)
              root.layoutDirection = View.LAYOUT_DIRECTION_RTL
              root.setBackgroundColor(if (blur) Color.argb(70, 0, 0, 0) else Color.argb(205, 0, 0, 0))
              root.isClickable = true
              root.setOnTouchListener { _, _ -> true }

              val card = LinearLayout(ctx)
              card.orientation = LinearLayout.VERTICAL
              card.gravity = Gravity.CENTER_HORIZONTAL
              card.setPadding(dp(ctx, 24), dp(ctx, 28), dp(ctx, 24), dp(ctx, 20))
              card.background = GradientDrawable().apply {
                setColor(cardColor)
                cornerRadius = dp(ctx, 28).toFloat()
              }
              card.elevation = dp(ctx, 14).toFloat()

              val icon = BatteryIcon(ctx, accent)
              card.addView(icon, LinearLayout.LayoutParams(dp(ctx, 76), dp(ctx, 38)))

              val title = label(ctx, "قم بشحن جهازك", 22f, titleColor, true)
              val tlp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
              tlp.topMargin = dp(ctx, 18)
              card.addView(title, tlp)

              val sub = label(ctx, "البطارية منخفضة جداً (1%)", 15f, subColor, false)
              val slp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
              slp.topMargin = dp(ctx, 6)
              card.addView(sub, slp)

              val line = View(ctx)
              line.setBackgroundColor(lineColor)
              val llp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(ctx, 1))
              llp.topMargin = dp(ctx, 18)
              card.addView(line, llp)

              val note = label(ctx, "ملاحظة: وصّل الشاحن عشان التليفون ميفصلش وصلاحيات الروت المؤقت ما تروحش.", 12f, noteColor, false)
              val nlp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
              nlp.topMargin = dp(ctx, 14)
              card.addView(note, nlp)

              val clp = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT)
              clp.gravity = Gravity.CENTER
              clp.leftMargin = dp(ctx, 32)
              clp.rightMargin = dp(ctx, 32)
              root.addView(card, clp)

              root.alpha = 0f
              card.scaleX = 0.92f
              card.scaleY = 0.92f
              root.post {
                root.animate().alpha(1f).setDuration(220).start()
                card.animate().scaleX(1f).scaleY(1f).setDuration(220).start()
              }
              return root
            }

            override fun onReceive(c: Context, i: Intent) {
              val ctx = c.applicationContext
              val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              when (i.action) {
                "com.guard.SHOW" -> if (view == null) {
                  val blur = Build.VERSION.SDK_INT >= 31 && wm.isCrossWindowBlurEnabled
                  val v = buildView(ctx, blur)
                  var flags = WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                    WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                    WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  if (blur) {
                    @Suppress("DEPRECATION")
                    flags = flags or WindowManager.LayoutParams.FLAG_BLUR_BEHIND
                  }
                  val p = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    flags,
                    PixelFormat.TRANSLUCENT
                  )
                  if (Build.VERSION.SDK_INT >= 28) {
                    p.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  if (blur) {
                    p.blurBehindRadius = 90
                  }
                  try {
                    wm.addView(v, p)
                    view = v
                  } catch (_: Exception) {
                  }
                }
                "com.guard.HIDE" -> view?.let {
                  try {
                    wm.removeView(it)
                  } catch (_: Exception) {
                  }
                  view = null
                }
              }
            }

            companion object {
              var view: View? = null
            }
          }
          GUARD_EOF
      - name: Build APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          for i in 1 2 3 4 5 6; do
            curl -fL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip && break
            echo "download failed, retry $i"; sleep 15
          done
          unzip -q gradle.zip -d "$HOME"
          cd overlay_app
          for i in 1 2 3; do
            "$HOME/gradle-8.7/bin/gradle" assembleDebug --no-daemon && break
            echo "build failed, retry $i"; sleep 20
          done
          ls app/build/outputs/apk/debug/app-debug.apk
      - name: Assemble module
        run: |
          cp overlay_app/app/build/outputs/apk/debug/app-debug.apk battery_guard/overlay.apk
          chmod +x battery_guard/*.sh
          cd battery_guard && zip -r ../battery_guard_module.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: battery_guard_module
          path: battery_guard_module.zip
